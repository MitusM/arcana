<div class="container-fluid">
  <div class="row">{% include "../breadcrumb.html" %}</div>
  <div class="article">
    <div class="container-fluid">
      <div class="row card">
        <div class="card-body">
          {% if article %}
            <h2>Редактировать статью</h2>
          {% else %}
            <h2>Создать статью</h2>
          {% endif %}

          <form class="mt-3" id="articleForm">
            <fieldset class="form-group-row">
              <label>Название (ru):</label>
              <input type="text" class="form-group-input form-control" name="title" value="{% if article %}{{ article.title.ru or article.title }}{% endif %}" required autofocus>
            </fieldset>

            <fieldset class="form-group-row">
              <label>URL:</label>
              <input type="text" class="form-group-input form-control" name="url" value="{{ article.url or '' }}" placeholder="chto-posmotret-v-azii">
            </fieldset>

            <fieldset class="form-group-row">
              <label>SEO-описание:</label>
              <textarea class="form-control" name="description" rows="2">{{ article.description or '' }}</textarea>
            </fieldset>

            <fieldset class="form-group-row">
              <label>SEO keyword:</label>
              <input type="text" class="form-group-input form-control" name="keyword" value="{{ article.keyword or '' }}" placeholder="что посмотреть в азии, достопримечательности азии">
            </fieldset>

            <fieldset class="form-group-row">
              <label>Теги (через запятую):</label>
              <input type="text" class="form-group-input form-control" name="tags" value="{{ article.tags.ru or article.tags or '' }}">
            </fieldset>

            <fieldset class="form-group-row">
              <label>URL главного изображения:</label>
              <input type="text" class="form-group-input form-control" name="image" value="{{ article.image or '' }}">
            </fieldset>

            <fieldset class="form-group-row">
              <label>Автор:</label>
              <input type="text" class="form-group-input form-control" name="author" value="{{ article.author or '' }}">
            </fieldset>

            <fieldset class="form-group-row">
              <label>Порядок сортировки:</label>
              <input type="number" class="form-group-input form-control" name="sortOrder" value="{{ article.sortOrder or 0 }}">
            </fieldset>

            <div class="form-group-row">
              <label class="d-block mb-2">Настройки:</label>
              <div class="form-check form-check-inline">
                <input type="checkbox" class="form-check-input" name="searchable" id="searchable" {% if article.searchable or not article %}checked{% endif %}>
                <label class="form-check-label" for="searchable">Доступно для поиска</label>
              </div>
            </div>

            <fieldset class="form-group__content mt-3">
              <label>Содержание статьи (HTML):</label>
              <textarea name="content" id="content" rows="20" class="form-control">{{ article.content.ru or article.content or '' }}</textarea>
            </fieldset>

            <div class="d-flex gap-2 mt-3">
              <div class="form-grid-column__save btn btn-primary" id="submitBtn">
                {% if article %}Сохранить{% else %}Создать статью{% endif %}
              </div>
              {% if article %}
                {% if article.published %}
                  <button class="btn btn-warning" id="unpublishBtn">Снять с публикации</button>
                {% else %}
                  <button class="btn btn-success" id="publishBtn">Опубликовать</button>
                {% endif %}
              {% endif %}
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('submitBtn')?.addEventListener('click', function(e) {
  const form = document.getElementById('articleForm');
  const data = {
    title: document.querySelector('[name="title"]').value,
    url: document.querySelector('[name="url"]').value,
    description: document.querySelector('[name="description"]').value,
    keyword: document.querySelector('[name="keyword"]').value,
    tags: document.querySelector('[name="tags"]').value,
    image: document.querySelector('[name="image"]').value,
    author: document.querySelector('[name="author"]').value,
    sortOrder: document.querySelector('[name="sortOrder"]').value,
    searchable: document.getElementById('searchable').checked,
    {% if not article %}parentRid: '{{ parentRid }}',{% endif %}
    csrf_token: '{{ csrf }}'
  };
  {% if article %}
    axios.put('/article/admin/{{ article.rid }}', data).then(r => {
      if (r.data.status === 200) location.href = '/article/admin/';
    });
  {% else %}
    axios.post('/article/admin', data).then(r => {
      if (r.data.status === 201) location.href = '/article/admin/';
    });
  {% endif %}
});

{% if article %}
document.getElementById('publishBtn')?.addEventListener('click', function() {
  axios.put('/article/admin/{{ article.rid }}/publish', { csrf_token: '{{ csrf }}' })
    .then(r => { if (r.data.status === 200) location.reload(); });
});
document.getElementById('unpublishBtn')?.addEventListener('click', function() {
  axios.put('/article/admin/{{ article.rid }}/unpublish', { csrf_token: '{{ csrf }}' })
    .then(r => { if (r.data.status === 200) location.reload(); });
});
{% endif %}
</script>
